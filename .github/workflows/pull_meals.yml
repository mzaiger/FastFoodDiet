name: Pull fast food meals (manual)

# Step 1 of 2, run by hand: Actions tab > "Pull fast food meals (manual)" > Run workflow.
# Pulls new meals from Gemini with an EMPTY picture and stamps them with today's date.
# Then run "Fill missing meal images (manual)" (step 2) to find the pictures.

on:
  workflow_dispatch:
    inputs:
      max_gemini_calls:
        description: "Max Gemini calls per model per day (free tier is 20)"
        required: false
        default: "20"

concurrency:
  group: pull-meals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull meals (Gemini Flash 3.8/3.7/3.6/3.5; resumes where the last run stopped; pictures left empty)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MAX_GEMINI_CALLS: ${{ github.event.inputs.max_gemini_calls || '20' }}
        run: python pull_meals.py

      - name: Commit updated meals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meals.json
          git diff --staged --quiet || git commit -m "Daily fast food meal pull [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
