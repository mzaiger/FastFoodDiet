0rx='16'%20fill='%23c9cecf'/%3E%3Cpath%20d='M1420%20500%20L1450%20462%20H1570%20L1600%20500%20Z'%20fill='%23b4babc'/%3E%3Cpath%20d='M1458%20498%20L1478%20468%20H1520%20V498%20Z%20M1528%20498%20V468%20H1562%20L1584%20498%20Z'%20fill='%236f7a7c'/%3E%3Ccircle%20cx='1432'%20cy='552'%20r='22'%20fill='%231f2426'/%3E%3Ccircle%20cx='1432'%20cy='552'%20r='9'%20fill='%23c9cecf'/%3E%3Ccircle%20cx='1580'%20cy='552'%20r='22'%20fill='%231f2426'/%3E%3Ccircle%20cx='1580'%20cy='552'%20r='9'%20fill='%23c9cecf'/%3E%3C/g%3E%3Cg%3E%3Crect%20x='240'%20y='505'%20width='230'%20height='46'%20rx='15'%20fill='%232b2f31'/%3E%3Cpath%20d='M275%20505%20L303%20470%20H410%20L440%20505%20Z'%20fill='%233b4144'/%3E%3Cpath%20d='M310%20503%20L326%20475%20H364%20V503%20Z%20M372%20503%20V475%20H405%20L428%20503%20Z'%20fill='%239fb0b4'/%3E%3Ccircle%20cx='290'%20cy='553'%20r='21'%20fill='%231f2426'/%3E%3Ccircle%20cx='290'%20cy='553'%20r='8'%20fill='%238a9093'/%3E%3Ccircle%20cx='425'%20cy='553'%20r='21'%20fill='%231f2426'/%3E%3Ccircle%20cx='425'%20cy='553'%20r='8'%20fill='%238a9093'/%3E%3C/g%3E%3C/svg%3E");
  }

  *{ box-sizing:border-box; }

  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    margin:-1px;
    padding:0;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding:0 0 80px;
  }

  /* Full-bleed photo band. The side padding keeps the content on the same
     1080px column as <main>. */
  header{
    position:relative;
    background:var(--steel-deep);
    color:#fff;
    padding:56px max(24px, calc(50% - 516px)) 28px;
    margin-bottom:28px;
  }

  @supports (mix-blend-mode:multiply){
    header{
      isolation:isolate;
      background:#fff;
    }

    header::before,
    header::after{
      content:'';
      position:absolute;
      top:0;
      right:0;
      bottom:0;
      left:0;
      z-index:-1;
    }

    /* The photo, flattened to greys... */
    header::before{
      background:var(--hero-photo) center 40% / cover no-repeat;
      filter:grayscale(1) contrast(1.15);
    }

    /* ...then dyed steel blue. Multiply can only darken, so the lightest pixel
       of any photo is never lighter than the steel itself and the white type
       stays readable whichever photo is used. If the photo fails to load, the
       header is simply solid steel. */
    header::after{
      background:var(--steel);
      mix-blend-mode:multiply;
    }
  }

  @supports (mix-blend-mode:multiply){
    @media (max-width:760px){
      header::before{
        background:var(--hero-photo) center top / auto 300px no-repeat, #4a4f51;
      }
    }
  }

  h1{
    font-family:var(--sans);
    font-weight:900;
    font-size:clamp(36px, 6vw, 56px);
    letter-spacing:-0.025em;
    margin:0 0 10px;
    color:#fff;
    line-height:1;
    text-wrap:balance;
  }

  .sub{
    color:rgba(255,255,255,0.88);
    max-width:640px;
    font-size:15px;
    line-height:1.5;
    margin:0;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 18px;
    margin-bottom:18px;
  }

  .toolbar input[type="search"]{
    font-family:var(--sans);
    font-size:14px;
    border:1px solid var(--line-strong);
    border-radius:3px;
    padding:9px 12px;
    background:var(--frost);
    color:var(--ink);
    flex:1 1 240px;
    min-width:180px;
  }

  .toolbar input[type="search"]:focus{
    outline:2px solid var(--steel);
    outline-offset:1px;
  }

  .toolbar select{
    font-family:var(--sans);
    font-size:14px;
    border:1px solid var(--line-strong);
    border-radius:3px;
    padding:9px 12px;
    background:var(--frost);
    color:var(--ink);
  }

  .count-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .status{
    color:var(--ink-soft);
    font-size:14px;
    padding:40px 0;
    text-align:center;
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }

  thead th{
    text-align:left;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    background:var(--frost);
    padding:10px 14px;
    border-bottom:2px solid var(--ink);
    position:sticky;
    top:0;
  }

  tbody tr{
    border-bottom:1px solid var(--line);
  }

  tbody tr:last-child{
    border-bottom:none;
  }

  tbody tr:hover{
    background:rgba(42,94,115,0.06);
  }

  td{
    padding:10px 14px;
    font-size:14px;
    vertical-align:middle;
  }

  .col-img{ width:72px; }
  .col-cat{ width:110px; }
  .col-links{ width:170px; }
  .col-num{ width:84px; white-space:nowrap; }
  .col-serving{ width:130px; }
  .col-pick{ display:none; width:96px; }
  table.pick-mode .col-pick{ display:table-cell; }

  .prod-num{ font-size:13px; font-weight:600; white-space:nowrap; }
  .prod-serving{ font-size:12px; color:var(--ink-soft); overflow-wrap:anywhere; }

  /* Pick mode: opened from the "+" on a meal in index.html. */
  .pick-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    background:#FFF4CC;
    border:1px solid #E3C55A;
    border-radius:4px;
    padding:12px 18px;
    margin-bottom:18px;
    font-size:14px;
  }
  .pick-banner.on{ display:flex; }
  .pick-banner button{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line-strong);
    background:var(--card);
    color:var(--steel-deep);
    border-radius:3px;
    padding:7px 12px;
    cursor:pointer;
  }
  table.pick-mode tbody tr{ cursor:pointer; }
  .select-btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:700;
    border:0;
    background:var(--steel-deep);
    color:#fff;
    border-radius:3px;
    padding:8px 14px;
    cursor:pointer;
  }
  .select-btn:hover{ background:var(--steel); }

  .prod-thumb{
    width:56px;
    height:56px;
    object-fit:contain;
    background:var(--card);
    border:0px solid var(--line);
    border-radius:3px;
    display:block;
  }

  .prod-thumb-empty{
    width:56px;
    height:56px;
    background:var(--frost);
    border:1px dashed var(--warn);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:600;
    color:var(--warn);
    text-align:center;
    line-height:1.2;
  }

  .prod-name{
    color:var(--ink);
    line-height:1.35;
  }

  /* Restaurant name sits above the item name and reads as part of the name. */
  .prod-brand{ display:block; }

  /* Breakfast / Regular pill. */
  .prod-cat-pill{
    display:inline-block;
    padding:2px 10px;
    font-size:11px;
    font-weight:700;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--frost);
    color:var(--steel-deep);
  }
  .prod-cat-pill.breakfast{ background:#FFF4CC; border-color:#E3C55A; }
  .prod-cat-pill.dessert{ background:#F6E3EE; border-color:#D9A9C4; }

  /* Delivery-app search links: just the app's icon plus an arrow. */
  .deliv{
    display:inline-flex;
    align-items:center;
    gap:2px;
    padding:2px 0;
    color:var(--steel-deep);
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    line-height:1;
  }
  .deliv:hover{ opacity:.75; }
  .deliv-ic{
    display:block;
    width:22px;
    height:22px;
    border-radius:4px;
  }

  .prod-links{ white-space:nowrap; }
  /* Space between the three order icons (arrow to next icon): 13.3px. */
  .prod-links .deliv{ margin-right:13.3px; }
  .prod-links .deliv:first-child{ margin-left:2px; }

  .pager{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:22px 0;
  }

  .pager button{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line-strong);
    background:var(--card);
    color:var(--steel-deep);
    border-radius:3px;
    padding:8px 12px;
    cursor:pointer;
  }

  .pager button:hover:not(:disabled){
    border-color:var(--steel);
  }

  .pager button:disabled{
    opacity:0.35;
    cursor:default;
  }

  .pager button.active{
    background:var(--steel-deep);
    border-color:var(--steel-deep);
    color:#fff;
  }

  .pager .page-jump{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:8px;
  }

  .pager .page-jump input{
    width:54px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line-strong);
    border-radius:3px;
    padding:6px 8px;
    text-align:center;
  }

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:60px 20px;
    font-size:14px;
  }

  .empty-state code{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:0.92em;
    background:var(--frost);
    padding:2px 6px;
    border-radius:3px;
  }

  a:focus-visible,
  .select-btn:focus-visible,
  .pager button:focus-visible{
    outline:2px solid var(--steel);
    outline-offset:2px;
  }

  @media (max-width:640px){
    thead{ display:none; }
    table, tbody{ display:block; width:100%; }
    tbody tr{
      display:grid;
      grid-template-columns:64px auto auto minmax(0,1fr);
      grid-template-areas:
        "img name    name  name"
        "img cal     price serving"
        "cat cat     links links"
        "pick  pick  pick  pick";
      column-gap:12px;
      row-gap:4px;
      align-items:center;
      padding:14px;
    }
    td{ display:block; width:auto; padding:0; border:none; min-width:0; }
    .col-img{ grid-area:img; align-self:start; width:auto; }
    .prod-name{ grid-area:name; }
    .prod-cal{ grid-area:cal; }
    .prod-price{ grid-area:price; }
    .prod-serving{ grid-area:serving; }
    td.prod-cat{ grid-area:cat; margin-top:4px; }
    td.prod-links{ grid-area:links; margin-top:4px; }
    table.pick-mode .col-pick{ display:block; grid-area:pick; width:auto; margin-top:10px; }
    .select-btn{ width:100%; padding:12px 14px; font-size:15px; }
    .col-num, .col-serving{ width:auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Menu Items</h1>
</header>

<main>
  <div class="pick-banner" id="pick-banner">
    <span id="pick-banner-text">Choose a meal.</span>
    <button type="button" id="pick-cancel">Cancel &amp; go back</button>
  </div>

  <div class="toolbar">
    <input type="search" id="search-box" placeholder="Filter by item or restaurant&hellip;" />
    <select id="cat-filter" aria-label="Meal type">
      <option value="">All meals</option>
      <option value="breakfast">Breakfast</option>
      <option value="regular">Regular</option>
      <option value="dessert">Dessert / late night</option>
    </select>
    <span class="count-label" id="count-label"></span>
  </div>

  <div class="status" id="status">Loading menu items&hellip;</div>

  <div class="empty-state" id="empty-state" style="display:none;">
    Meal list not found. Run <code>pull_meals.py</code> (or wait for the daily GitHub Action) and make sure <code>meals.json</code> is deployed alongside this page.
  </div>

  <table id="products-table" style="display:none;">
    <thead>
      <tr>
        <th class="col-img">Image</th>
        <th>Item</th>
        <th class="col-num">Calories</th>
        <th class="col-num">Price</th>
        <th class="col-serving">Serving</th>
        <th class="col-cat">Type</th>
        <th class="col-links">Order</th>
        <th class="col-pick">Pick</th>
      </tr>
    </thead>
    <tbody id="products-body"></tbody>
  </table>

  <div class="pager" id="pager-top" style="display:none;"></div>
  <div class="pager" id="pager-bottom" style="display:none;"></div>
</main>

<script>
(function(){
  const PAGE_SIZE = 100;

  let allProducts = [];
  let filtered = [];
  let currentPage = 1;

  const statusEl = document.getElementById('status');
  const emptyEl = document.getElementById('empty-state');
  const tableEl = document.getElementById('products-table');
  const bodyEl = document.getElementById('products-body');
  const countEl = document.getElementById('count-label');
  const searchEl = document.getElementById('search-box');
  const catEl = document.getElementById('cat-filter');
  const pagerTop = document.getElementById('pager-top');
  const pagerBottom = document.getElementById('pager-bottom');

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getImage(p){ return p.image_url || ''; }
  function getImageFallback(p){ return p.image_full_url || ''; }
  function getRestaurant(p){ return p.restaurant || ''; }
  function getName(p){ return p.name || 'Unnamed item'; }
  function getCategory(p){ return (p.category === 'breakfast' || p.category === 'dessert') ? p.category : 'regular'; }
  const CATEGORY_LABELS = { breakfast: 'Breakfast', regular: 'Regular', dessert: 'Dessert' };
  function getCalories(p){
    const n = Number(p.calories);
    return (!isNaN(n) && n > 0) ? n : 0;
  }
  function getPriceNumber(p){
    const n = parseFloat(p.price);
    return isNaN(n) ? 0 : n;
  }
  function getServing(p){ return p.serving || 'N/A'; }

  // ---- Pick mode (opened from the "+" on a meal in index.html) ----
  const pickRequest = (function(){
    if (!/[?&]pick=1/.test(location.search)) return null;
    try{
      const r = JSON.parse(localStorage.getItem('lazymanPickRequest') || 'null');
      return (r && r.slot) ? r : null;
    }catch(err){ return null; }
  })();

  function trimProduct(p){
    // Same shape index.html builds from meals.json, so a hand-picked meal
    // shows up exactly like a generated one.
    return {
      PRODUCT_NAME: p.name,
      BRAND: p.restaurant,
      restaurant: p.restaurant,
      CATEGORY: CATEGORY_LABELS[getCategory(p)],
      calories: p.calories,
      PRICE_CURRENT: p.price,
      servings_per_container: p.serving,
      vegetarian: p.vegetarian === true,
      healthy: p.healthy === true,
      image_url: p.image_url || '',
      image_full_url: p.image_full_url || ''
    };
  }

  function choose(p){
    try{
      localStorage.setItem('lazymanPickResult', JSON.stringify({
        tab: pickRequest.tab,
        dayIndex: pickRequest.dayIndex,
        slot: pickRequest.slot,
        product: trimProduct(p)
      }));
      localStorage.removeItem('lazymanPickRequest');
    }catch(err){
      alert("Couldn't save your pick in this browser's storage.");
      return;
    }
    window.location.href = 'index.html';
  }

  // Delivery-app search links: restaurant + item go into each app's search URL.
  // Only the icon is shown (the app name is in the tooltip / screen-reader label).
  function deliveryLinksHtml(p){
    const query = encodeURIComponent(getRestaurant(p));
    const apps = [
      ['doordash.com', 'DoorDash',  `https://www.doordash.com/search/store/${query}/`],
      ['ubereats.com', 'Uber Eats', `https://www.ubereats.com/search?q=${query}`],
      ['grubhub.com', 'Grubhub',   `https://www.grubhub.com/search?queryText=${query}`]
    ];
    return apps.map(([domain, label, url]) =>
      `<a class="deliv" href="${url}" target="_blank" rel="noopener noreferrer" title="Search ${label}" aria-label="Search ${label}" onclick="event.stopPropagation()"><img class="deliv-ic" src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="" width="22" height="22" loading="lazy" referrerpolicy="no-referrer" /><span aria-hidden="true">&rarr;</span></a>`
    ).join('');
  }

  function renderRow(p){
    const name = getName(p);
    const image = getImage(p);
    const fallback = getImageFallback(p);
    const category = getCategory(p);

    const thumbImg = image
      ? `<img class="prod-thumb" src="${escapeHtml(image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fallback="${escapeHtml(fallback)}" />`
      : `<div class="prod-thumb-empty">no image</div>`;

    const cal = getCalories(p);
    const price = getPriceNumber(p);
    const serving = getServing(p);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-img">${thumbImg}</td>
      <td class="prod-name"><span class="prod-brand">${escapeHtml(getRestaurant(p))}</span>${escapeHtml(name)}</td>
      <td class="prod-num prod-cal">${cal ? cal + ' cal' : 'N/A'}</td>
      <td class="prod-num prod-price">${price ? '$' + price.toFixed(2) : 'N/A'}</td>
      <td class="prod-serving">${escapeHtml(serving)}</td>
      <td class="prod-cat"><span class="prod-cat-pill ${category}">${CATEGORY_LABELS[category]}</span></td>
      <td class="prod-links">${deliveryLinksHtml(p)}</td>
      <td class="col-pick"><button type="button" class="select-btn">Select</button></td>
    `;
    if (pickRequest){
      tr.querySelector('.select-btn').addEventListener('click', (e) => { e.stopPropagation(); choose(p); });
      tr.addEventListener('click', () => choose(p));
    }
    return tr;
  }

  function renderPage(toTop){
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(start, start + PAGE_SIZE);

    bodyEl.innerHTML = '';
    const fragment = document.createDocumentFragment();
    pageItems.forEach(p => fragment.appendChild(renderRow(p)));
    bodyEl.appendChild(fragment);

    const rangeStart = filtered.length === 0 ? 0 : start + 1;
    const rangeEnd = Math.min(start + PAGE_SIZE, filtered.length);
    countEl.textContent = `Showing ${rangeStart}-${rangeEnd} of ${filtered.length} (page ${currentPage} of ${totalPages})`;

    renderPager(pagerTop, totalPages);
    renderPager(pagerBottom, totalPages);

    // First load (e.g. arriving from a meal's "select" button): stay at the very
    // top so the pick banner and search box are visible. Paging/filtering still
    // jumps to the start of the table.
    window.scrollTo({ top: toTop ? 0 : tableEl.offsetTop - 20, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function renderPager(container, totalPages){
    container.innerHTML = '';
    if (totalPages <= 1){
      container.style.display = 'none';
      return;
    }
    container.style.display = 'flex';

    const makeBtn = (label, page, opts) => {
      opts = opts || {};
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      if (opts.disabled) btn.disabled = true;
      if (opts.active) btn.className = 'active';
      btn.addEventListener('click', () => { currentPage = page; renderPage(); });
      return btn;
    };

    container.appendChild(makeBtn('\u2190 Prev', currentPage - 1, { disabled: currentPage === 1 }));

    // Windowed page numbers: first, last, and a range around current.
    const windowSize = 2;
    const pages = new Set([1, totalPages]);
    for (let i = currentPage - windowSize; i <= currentPage + windowSize; i++){
      if (i >= 1 && i <= totalPages) pages.add(i);
    }
    const sorted = Array.from(pages).sort((a, b) => a - b);

    let prev = null;
    sorted.forEach(p => {
      if (prev !== null && p - prev > 1){
        const gap = document.createElement('span');
        gap.textContent = '\u2026';
        gap.style.color = 'var(--ink-soft)';
        gap.style.fontSize = '13px';
        container.appendChild(gap);
      }
      container.appendChild(makeBtn(String(p), p, { active: p === currentPage }));
      prev = p;
    });

    container.appendChild(makeBtn('Next \u2192', currentPage + 1, { disabled: currentPage === totalPages }));

    const jump = document.createElement('span');
    jump.className = 'page-jump';
    jump.innerHTML = `Go to <input type="number" min="1" max="${totalPages}" value="${currentPage}" /> `;
    const jumpInput = jump.querySelector('input');
    jumpInput.addEventListener('change', () => {
      const val = parseInt(jumpInput.value, 10);
      if (!isNaN(val)){
        currentPage = val;
        renderPage();
      }
    });
    container.appendChild(jump);
  }

  function applyFilter(){
    const q = searchEl.value.trim().toLowerCase();
    const cat = catEl.value;
    filtered = allProducts.filter(p => {
      if (cat && getCategory(p) !== cat) return false;
      if (!q) return true;
      return getName(p).toLowerCase().includes(q) || getRestaurant(p).toLowerCase().includes(q);
    });
    currentPage = 1;
    renderPage();
  }

  let debounceTimer = null;
  catEl.addEventListener('change', applyFilter);
  searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilter, 150);
  });

  async function init(){
    try{
      const res = await fetch('meals.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      const data = await res.json();
      const allowed = new Set(data.allowed_restaurants || []);
      allProducts = (data.meals || [])
        .filter(m => !allowed.size || allowed.has(m.restaurant))
        .sort((a, b) =>
          a.restaurant.localeCompare(b.restaurant) ||
          getCategory(a).localeCompare(getCategory(b)) ||
          a.name.localeCompare(b.name));
      filtered = allProducts;

      statusEl.style.display = 'none';
      if (allProducts.length === 0){
        emptyEl.style.display = 'block';
        return;
      }
      tableEl.style.display = 'table';
      renderPage(true);
    } catch (err){
      statusEl.style.display = 'none';
      emptyEl.style.display = 'block';
      console.error('Failed to load meals.json', err);
    }
  }

  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.classList.contains('prod-thumb')) return;
    const fb = img.dataset.fallback;
    if (fb && img.src !== fb && !img.dataset.triedFallback){
      img.dataset.triedFallback = '1';
      img.src = fb;
      return;
    }
    const empty = document.createElement('div');
    empty.className = 'prod-thumb-empty';
    empty.textContent = 'no image';
    img.replaceWith(empty);
  }, true);

  if (pickRequest){
    tableEl.classList.add('pick-mode');
    const where = [pickRequest.dayName, pickRequest.slot].filter(Boolean).join(' \u00b7 ');
    document.getElementById('pick-banner-text').textContent =
      'Choosing a meal for ' + where + ' \u2014 click a product (or Select) to put it in your plan.';
    document.getElementById('pick-banner').classList.add('on');
    document.getElementById('pick-cancel').addEventListener('click', () => {
      try{ localStorage.removeItem('lazymanPickRequest'); }catch(err){}
      window.location.href = 'index.html';
    });
  }

  init();
})();
</script>

</body>
</html>
